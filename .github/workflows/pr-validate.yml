# Validates that a pull request builds, passes its tests and produces an image.
# Nothing is pushed or deployed; tf_plan_staging.yml covers the Terraform side.
name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VIEWER_REF: main

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Check out feedback-viewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cds-snc/dto-feedback-viewer
          ref: ${{ env.VIEWER_REF }}
          path: feedback-viewer
          persist-credentials: false

      - name: Install feedback-viewer classes and local jars
        run: |
          mvn -B -q -DskipTests -f feedback-viewer/pom.xml install
          mvn -B install:install-file -Dfile="lib/airtable.java-0.2.0.jar" -DgroupId="com.sybit" -DartifactId="airtable.java" -Dversion="0.2.0" -Dpackaging=jar -DgeneratePom=true

      - name: Build and test
        run: mvn -B verify

      - name: Build image
        run: docker build -f ./docker/Dockerfile . -t feedback-cj:${{ github.sha }}
